<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Anket açılıyor…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;
       background:#f8fafc;color:#0f172a;
       font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
       padding:24px}
  .box{text-align:center;max-width:340px}
  .ring{width:46px;height:46px;margin:0 auto 22px;border-radius:50%;
        border:3px solid #e2e8f0;border-top-color:#0f172a;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
  p{font-size:14px;color:#64748b;margin-top:8px;line-height:1.5}
  .err .ring{display:none}
  .code{display:inline-block;margin-top:14px;padding:6px 12px;border-radius:8px;
        background:#f1f5f9;font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}
  #act{margin-top:18px}
  .btn{padding:13px 26px;border:none;border-radius:12px;background:#0f172a;color:#fff;
       font:600 15px inherit;cursor:pointer;font-family:inherit}
  .btn:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="ring"></div>
  <h1 id="t">Anketiniz hazırlanıyor</h1>
  <p id="s">Birkaç saniye sürebilir…</p>
  <div id="act"></div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzCfdhoKPMPsHNMX0NQk2hJE6_IZu7Tc42-ft1md5IVw5xLE8yF7_E2CM1DLHT5TNGPkA/exec';
const qs  = new URLSearchParams(location.search);
const k   = (qs.get('k') || location.search.replace(/^\?/, '').split('&')[0]).toUpperCase().trim();
const TRIES = 8;

function el(id){ return document.getElementById(id); }

function fail(msg, retry) {
  document.getElementById('box').className = 'box err';
  el('t').textContent = 'Bağlantı açılamadı';
  el('s').innerHTML = msg + (k ? '<br><span class="code">' + k + '</span>' : '');
  el('act').innerHTML = retry
    ? '<button class="btn" onclick="start()">Tekrar dene</button>'
    : '';
}

function go(d) {
  const page = d.module === 'hip'  ? '../form-hip.html'
             : d.module === 'uyku' ? '../form-uyku.html'
             : '../form.html';
  const p = new URLSearchParams({ name: d.name || '', id: d.id || '' });
  if (d.module === 'uyku') {
    if (d.procedure) p.set('dx', d.procedure);
    if (qs.get('src')) p.set('src', qs.get('src'));   // hangi oda/hekim yönlendirdi
  } else {
    p.set('surgery', d.surgery || ''); p.set('leg', d.leg || ''); p.set('fu', d.fu || '');
    if (d.module !== 'hip') p.set('procedure', d.procedure || 'Kalsifik Tendinit');
  }
  location.replace(page + '?' + p.toString());
}

// Apps Script ucu ara sıra HTML hata sayfası dönüyor — ısrarla tekrar dene.
// Hastaya tek bir aksilikte "açılamadı" gösterme.
function attempt(n) {
  if (n > 1) el('s').textContent = 'Bağlanılıyor… (' + n + '/' + TRIES + ')';
  fetch(API + '?action=link&k=' + encodeURIComponent(k) + '&_=' + Date.now())
    .then(r => r.text())
    .then(t => {
      let d;
      try { d = JSON.parse(t); } catch (e) { throw new Error('gecersiz'); }
      if (!d || d.status !== 'ok') {
        fail('Bu bağlantı bulunamadı. Lütfen doktorunuza bildirin.', false);
        return;
      }
      go(d);
    })
    .catch(() => {
      if (n < TRIES) { setTimeout(() => attempt(n + 1), Math.min(4000, 600 * n)); return; }
      fail('Sunucuya ulaşılamadı. Birkaç saniye sonra tekrar deneyin.', true);
    });
}

function start() {
  document.getElementById('box').className = 'box';
  el('t').textContent = 'Anketiniz hazırlanıyor';
  el('s').textContent = 'Birkaç saniye sürebilir…';
  el('act').innerHTML = '';
  attempt(1);
}

if (!/^[A-Z0-9]{4,8}$/.test(k)) {
  fail('Bağlantı eksik görünüyor. Lütfen doktorunuzdan yeni bir bağlantı isteyin.', false);
} else {
  start();
}
</script>
</body>
</html>
