<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Omuz Ameliyat Öncesi Değerlendirme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#09090b; --ink-2:#3f3f46; --muted:#8b8b94; --line:#ebebef;
  --bg:#ffffff; --surface:#fafafa; --lift:0 1px 2px rgba(9,9,11,.04), 0 8px 28px -12px rgba(9,9,11,.10);
  --ease:cubic-bezier(.22,1,.36,1); --fast:.22s; --mid:.36s;
}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  font-feature-settings:'cv11','ss01','tnum';-webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;background:var(--bg);color:var(--ink);font-size:16px;
  line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}

.rail{position:fixed;top:0;left:0;right:0;height:2px;background:var(--line);z-index:60}
.rail-fill{height:100%;background:var(--ink);width:0;transition:width .5s var(--ease)}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;z-index:50;background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;transition:border-color var(--fast)}
.topbar.solid{border-bottom-color:var(--line)}
.tb-back{width:34px;height:34px;margin-left:-8px;border:none;background:transparent;border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);
  opacity:0;pointer-events:none;transition:opacity var(--fast),background var(--fast)}
.tb-back.on{opacity:1;pointer-events:auto}
.tb-back:active{background:var(--surface)}
.tb-count{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.tb-count b{color:var(--ink)}

.stage{min-height:100dvh;padding:56px 0 0;display:flex;flex-direction:column}
.screen{flex:1;display:none;flex-direction:column;padding:22px 22px 132px;max-width:620px;
  width:100%;margin:0 auto}
.screen.live{display:flex}
.screen > .mid{margin-top:auto;margin-bottom:auto;width:100%}
.screen.tall > .mid{margin-top:0}
.screen.in-f{animation:inF var(--mid) var(--ease) both}
.screen.in-b{animation:inB var(--mid) var(--ease) both}
@keyframes inF{from{opacity:0;transform:translate3d(26px,0,0)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translate3d(-26px,0,0)}to{opacity:1;transform:none}}

.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px}
h1{font-size:clamp(25px,6.6vw,32px);font-weight:700;letter-spacing:-.035em;line-height:1.16}
.sub{font-size:15px;color:var(--muted);margin-top:11px;line-height:1.55;max-width:46ch}
.body{margin-top:28px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{position:relative;display:flex;align-items:center;gap:13px;width:100%;padding:16px 18px;
  border:1px solid var(--line);border-radius:15px;background:var(--bg);text-align:left;
  font-size:16px;font-weight:550;cursor:pointer;
  transition:transform .14s var(--ease),border-color var(--fast),background var(--fast),box-shadow var(--fast)}
.opt:active{transform:scale(.982)}
.opt .dot{width:19px;height:19px;border-radius:50%;border:1.5px solid #d4d4d8;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;transition:all var(--fast)}
.opt .dot svg{opacity:0;transform:scale(.4);transition:all .2s var(--ease)}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff;box-shadow:var(--lift)}
.opt.on .dot{border-color:#fff;background:#fff}
.opt.on .dot svg{opacity:1;transform:none}
.opt small{display:block;font-size:12.5px;font-weight:450;opacity:.62;margin-top:2px;line-height:1.4}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opts.row .opt{flex:1 1 0;min-width:100px;justify-content:center;text-align:center}
.opts.row .opt .dot{display:none}

.field{width:100%;padding:16px 2px;border:none;border-bottom:1.5px solid var(--line);
  font-size:23px;font-weight:600;letter-spacing:-.02em;background:transparent;
  transition:border-color var(--fast)}
.field::placeholder{color:#c8c8cf;font-weight:500}
.field:focus{outline:none;border-bottom-color:var(--ink)}
.field.sm{font-size:19px;padding:13px 2px}
.field[type=date]{font-size:19px}
.pair{display:flex;gap:22px}
.pair > div{flex:1}
.flab{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.readout{margin-top:20px;font-size:14px;color:var(--muted);opacity:0;transform:translateY(5px);
  transition:all var(--mid) var(--ease)}
.readout.on{opacity:1;transform:none}
.readout b{color:var(--ink);font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:12px 17px;border:1px solid var(--line);border-radius:999px;background:var(--bg);
  font-size:15px;font-weight:550;cursor:pointer;
  transition:transform .14s var(--ease),border-color var(--fast),background var(--fast),color var(--fast)}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}

/* ── Likert ızgarası (ASES) ──────────────────────────── */
.lk-head{position:sticky;top:56px;z-index:30;background:rgba(255,255,255,.93);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:9px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line);
  display:flex;gap:4px}
.lk-head span{flex:1;text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.02em;
  color:var(--muted);line-height:1.25;text-transform:uppercase}
.lk-row{padding:13px 0 11px;border-bottom:1px solid var(--line)}
.lk-row:last-child{border-bottom:none}
.lk-q{font-size:14.5px;font-weight:550;line-height:1.4;margin-bottom:9px;display:flex;gap:8px}
.lk-n{flex:0 0 auto;font-size:11px;font-weight:700;color:#c0c0c8;padding-top:2px;
  font-variant-numeric:tabular-nums}
.lk-opts{display:flex;gap:4px}
.lk-b{flex:1;padding:11px 2px;border:1px solid var(--line);border-radius:10px;background:#fff;
  font-size:12px;font-weight:650;color:var(--ink-2);cursor:pointer;
  transition:all .15s var(--ease)}
.lk-b:active{transform:scale(.95)}
.lk-b.on{border-color:var(--ink);background:var(--ink);color:#fff}
.lk-done{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
.lk-done b{color:var(--ink)}

/* ── Tegner merdiveni ────────────────────────────────── */
.tg{display:flex;flex-direction:column-reverse;gap:5px}
.tg-b{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1px solid var(--line);
  border-radius:12px;background:#fff;cursor:pointer;text-align:left;
  transition:all .15s var(--ease)}
.tg-b:active{transform:scale(.99)}
.tg-b.on{border-color:var(--ink);background:var(--ink);color:#fff}
.tg-n{flex:0 0 26px;height:26px;border-radius:8px;background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;transition:all .15s var(--ease)}
.tg-b.on .tg-n{background:#fff}
.tg-t{font-size:13.5px;font-weight:550;line-height:1.4;padding-top:3px}

.dock{position:fixed;bottom:0;left:0;right:0;padding:16px 22px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,rgba(255,255,255,0));z-index:50;
  display:flex;justify-content:center}
.dock-in{width:100%;max-width:620px;display:flex;align-items:center;gap:13px}
.cta{flex:1;padding:17px;border:none;border-radius:15px;background:var(--ink);color:#fff;
  font-size:16.5px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
  transition:transform .14s var(--ease),opacity var(--fast)}
.cta:active{transform:scale(.98)}
.cta[disabled]{opacity:.28;pointer-events:none}
.dock.hide{opacity:0;pointer-events:none;transform:translateY(8px);transition:all var(--fast)}

.cover{justify-content:center;padding-bottom:150px}
.cover > *{width:100%}
.cover h1{font-size:clamp(30px,8.4vw,42px);letter-spacing:-.04em;line-height:1.08}
.cover .sub{font-size:16.5px;color:var(--ink-2);margin-top:16px;max-width:40ch}
.facts{display:flex;gap:26px;margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}
.fact-k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fact-v{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.consent{margin-top:24px;font-size:13px;color:var(--muted);line-height:1.62;max-width:48ch}

.done{align-items:center;justify-content:center;text-align:center}
.ring{width:66px;height:66px;border-radius:50%;background:var(--ink);display:flex;
  align-items:center;justify-content:center;margin-bottom:26px;animation:pop .55s var(--ease) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.done h1{font-size:29px}
.done .sub{margin-top:13px;text-align:center}
.go2{margin-top:26px;padding:17px 30px;border:none;border-radius:15px;background:var(--ink);
  color:#fff;font-size:16.5px;font-weight:650;letter-spacing:-.01em;cursor:pointer;
  transition:transform .14s var(--ease)}
.go2:active{transform:scale(.97)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
/* ── Uyku pozisyonu ────────────────────────────────────── */
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pos{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--bg);
  padding:9px 8px 11px;cursor:pointer;
  transition:transform .18s var(--ease),border-color var(--fast),box-shadow var(--fast)}
.pos:active{transform:scale(.975)}
.pos.on{border-color:var(--ink);box-shadow:var(--lift)}
.pos-art{position:relative;border-radius:12px;background:var(--surface);overflow:hidden;
  transition:background var(--fast);aspect-ratio:1116/2000}
.pos-art img{opacity:0;transition:opacity .3s var(--ease)}
.pos-art img.rdy{opacity:1}
.pos-art svg{margin:-2px 0 -4px}
.pos.on .pos-art{background:#f1f1f4}
.pos svg{display:block;width:100%;height:auto}
.pos-name{font-size:13.5px;font-weight:650;letter-spacing:-.015em;text-align:center;margin-top:8px}
.pos-sub{font-size:11px;color:var(--muted);text-align:center;line-height:1.3;margin-top:1px;
  padding:0 2px}
.pos-tick{position:absolute;top:7px;right:7px;z-index:2;width:21px;height:21px;border-radius:50%;
  background:var(--ink);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.5);transition:all .26s var(--ease)}
.pos.on .pos-tick{opacity:1;transform:none}
/* nefes alma — sadece seçili kartta, dikkat dağıtmasın */
.pos.on .breathe{animation:breathe 3.6s ease-in-out infinite;transform-origin:center}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.pos.on .sway{animation:sway 4.4s ease-in-out infinite;transform-origin:60px 50px}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.clock-wrap{display:flex;justify-content:center;padding-top:4px}
.clock{width:100%;max-width:300px;height:auto;overflow:visible}
.seg{cursor:pointer}
.seg-bg{stroke:#fff;stroke-width:2;
  transition:fill .28s var(--ease),transform .2s var(--ease);transform-origin:125px 125px}
.seg:active .seg-bg{transform:scale(.975)}
/* Gündüz sıcak, akşam alacakaranlık, gece serin — tonlar hafif tutuldu */
.tone-gunduz .seg-bg{fill:#fdf3dd}  .tone-gunduz .ico{color:#d97706}
.tone-aksam  .seg-bg{fill:#fbe8de}  .tone-aksam  .ico{color:#e07a4c}
.tone-gece   .seg-bg{fill:#e9edf4}  .tone-gece   .ico{color:#64748b}
.ico{pointer-events:none;transition:color .28s var(--ease)}
.seg-h{font-size:13.5px;font-weight:700;fill:var(--ink);text-anchor:middle;
  letter-spacing:-.02em;pointer-events:none;transition:fill .28s var(--ease)}
.seg-w{font-size:10px;font-weight:600;fill:var(--muted);text-anchor:middle;
  letter-spacing:.05em;pointer-events:none;transition:fill .28s var(--ease)}
.seg.on .seg-bg{fill:var(--ink)}
.seg.on .ico{color:#fff}
.seg.on .seg-h{fill:#fff}
.seg.on .seg-w{fill:rgba(255,255,255,.7)}
.mk{font-size:9.5px;font-weight:700;fill:#b9b9c2;text-anchor:middle;letter-spacing:.04em}
.ctr-a{font-size:15px;font-weight:700;fill:var(--muted);text-anchor:middle;letter-spacing:-.01em;
  transition:fill .28s var(--ease)}
.ctr-a.set{fill:var(--ink)}
.ctr-b{font-size:11.5px;font-weight:600;fill:#b8b8c0;text-anchor:middle;letter-spacing:.02em}
/* ── Pozisyon ızgarası (fotoğraf) ──────────────────────── */
.pos-art img{display:block;width:100%;height:auto;aspect-ratio:1116/2000;object-fit:cover;
  border-radius:10px}
.pos-no{position:absolute;top:7px;left:7px;z-index:2;min-width:21px;height:21px;padding:0 6px;
  border-radius:7px;background:rgba(9,9,11,.62);backdrop-filter:blur(6px);color:#fff;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.pos-zoom{position:absolute;bottom:7px;right:7px;z-index:2;width:26px;height:26px;border-radius:50%;
  background:rgba(9,9,11,.52);backdrop-filter:blur(6px);display:flex;align-items:center;
  justify-content:center;transition:background .2s var(--ease)}
.pos:active .pos-zoom{background:rgba(9,9,11,.8)}
/* ── Tam ekran görüntüleyici ───────────────────────────── */
.lb{position:fixed;inset:0;z-index:200;background:#0b0b0e;display:flex;flex-direction:column;
  animation:lbIn .28s var(--ease) both}
.lb[hidden]{display:none!important}   /* .lb'nin display'i [hidden]'ı eziyordu */
@keyframes lbIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.lb-top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.lb-btn{width:40px;height:40px;border:none;border-radius:12px;background:rgba(255,255,255,.09);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lb-btn:active{background:rgba(255,255,255,.18)}
.lb-count{color:rgba(255,255,255,.62);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  padding:0 8px;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;
  animation:lbImg .26s var(--ease) both}
@keyframes lbImg{from{opacity:0}to{opacity:1}}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;
  border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer;backdrop-filter:blur(8px)}
.lb-nav:active{background:rgba(255,255,255,.24)}
.lb-nav.prev{left:6px} .lb-nav.next{right:6px}
.lb-foot{padding:16px 20px calc(18px + env(safe-area-inset-bottom));text-align:center}
.lb-name{color:#fff;font-size:19px;font-weight:700;letter-spacing:-.02em}
.lb-sub{color:rgba(255,255,255,.55);font-size:13.5px;margin-top:2px}
.lb-ok{width:100%;margin-top:14px;padding:16px;border:none;border-radius:14px;background:#fff;
  color:#09090b;font-size:16.5px;font-weight:650;cursor:pointer;transition:transform .14s var(--ease)}
.lb-ok:active{transform:scale(.98)}
.lb-alt{width:100%;margin-top:8px;padding:11px;border:none;background:transparent;
  color:rgba(255,255,255,.55);font-size:13.5px;font-weight:500;cursor:pointer}

/* 0-10 ağrı ölçeği */
.vas{display:flex;gap:5px}
.vas-b{flex:1;min-width:0;padding:15px 0;border:1px solid var(--line);border-radius:11px;
  background:#fff;font-size:15px;font-weight:600;cursor:pointer;
  transition:transform var(--fast),background var(--fast),border-color var(--fast)}
.vas-b:active{transform:scale(.94)}
.vas-b.on{border-color:var(--ink);background:var(--ink);color:#fff}
.ends{display:flex;justify-content:space-between;margin-top:11px;font-size:12.5px;color:var(--muted)}
/* WORC görsel analog satırı */
.sl-row{padding:17px 0 13px;border-bottom:1px solid var(--line)}
.sl-row:last-of-type{border-bottom:none}
.sl-q{display:flex;gap:10px;font-size:15px;line-height:1.45;margin-bottom:15px}
.sl-n{flex:0 0 21px;height:21px;border-radius:7px;background:var(--surface);color:var(--muted);
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sl-row.ok .sl-n{background:var(--ink);color:#fff}
.sl{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer}
.sl::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
.sl::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;border:1.5px solid var(--line);box-shadow:var(--lift);margin-top:-11px;
  transition:border-color var(--fast),background var(--fast)}
.sl::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;
  border:1.5px solid var(--line);box-shadow:var(--lift)}
.sl-row.ok .sl::-webkit-slider-thumb{background:var(--ink);border-color:var(--ink)}
.sl-row.ok .sl::-moz-range-thumb{background:var(--ink);border-color:var(--ink)}
.sl-val{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sl-row.ok .sl-val{color:var(--ink)}
/* yüzde kaydıracı */
.pct-big{font-size:58px;font-weight:800;letter-spacing:-.04em;text-align:center;margin-bottom:6px;
  font-variant-numeric:tabular-nums}
.pct-sub{text-align:center;font-size:13.5px;color:var(--muted);margin-bottom:26px}
</style>
</head>
<body>

<div class="rail"><div class="rail-fill" id="rail"></div></div>
<div class="topbar" id="topbar">
  <button class="tb-back" id="back" onclick="prev()" aria-label="Geri">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
         stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="tb-count" id="count"></div>
</div>

<!-- Tam ekran pozisyon görüntüleyici -->
<div class="lb" id="lb" hidden>
  <div class="lb-top">
    <button class="lb-btn" onclick="closeLb()" aria-label="Kapat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="lb-count" id="lbCount"></div>
    <div style="width:40px"></div>
  </div>
  <div class="lb-stage">
    <button class="lb-nav prev" onclick="stepLb(-1)" aria-label="Önceki">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <img id="lbImg" alt="">
    <button class="lb-nav next" onclick="stepLb(1)" aria-label="Sonraki">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="lb-foot">
    <div class="lb-name" id="lbName"></div>
    <div class="lb-sub" id="lbSub"></div>
    <button class="lb-ok" onclick="confirmLb()">Bu benim pozisyonum</button>
    <button class="lb-alt" onclick="closeLb()">Başka bir pozisyona bakayım</button>
  </div>
</div>

/* ─── 24 saatlik kadran ──────────────────────────────────────────────────
   Gün üç eşit dilime ayrılır. Kadran 08.00'de başlar: gündüz SAĞ ÜSTTE,
   akşam altta, gece sol üstte. Her dilimde güneş / batan güneş / ay simgesi
   var — hasta "gece nerede, gündüz nerede" diye düşünmesin.                */
const DIAL_START = 8;
function polar(cx, cy, r, h){
  const a = ((h - DIAL_START) / 24) * Math.PI * 2 - Math.PI / 2;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function donutArc(cx, cy, R, r, h0, h1, gapH){
  const a0 = h0 + gapH, a1 = h1 - gapH;
  const [ox0,oy0] = polar(cx,cy,R,a0), [ox1,oy1] = polar(cx,cy,R,a1);
  const [ix1,iy1] = polar(cx,cy,r,a1), [ix0,iy0] = polar(cx,cy,r,a0);
  const big = (a1 - a0) > 12 ? 1 : 0;
  return `M${ox0.toFixed(1)} ${oy0.toFixed(1)} A${R} ${R} 0 ${big} 1 ${ox1.toFixed(1)} ${oy1.toFixed(1)}` +
         ` L${ix1.toFixed(1)} ${iy1.toFixed(1)} A${r} ${r} 0 ${big} 0 ${ix0.toFixed(1)} ${iy0.toFixed(1)} Z`;
}

function clockSVG(){
  const C = 125, R = 105, r = 45, MID = (R + r) / 2;
  const segs = SLOTS.map((sl, k) => {
    const [lx, ly] = polar(C, C, MID, (sl.from + sl.to) / 2);
    return `<g class="seg tone-${sl.tone}" data-v="${sl.v}" data-k="${k}">
      <path class="seg-bg" d="${donutArc(C,C,R,r,sl.from,sl.to,0.32)}"/>
      <g class="ico" transform="translate(${lx.toFixed(1)},${(ly-19).toFixed(1)})">${ICONS[sl.tone]}</g>
      <text class="seg-h" x="${lx.toFixed(1)}" y="${(ly+6).toFixed(1)}">${String(sl.from).padStart(2,'0')}–${String(sl.to%24).padStart(2,'0')}</text>
      <text class="seg-w" x="${lx.toFixed(1)}" y="${(ly+18).toFixed(1)}">${sl.word}</text>
    </g>`;
  }).join('');
  // İşaretler dilim SINIRLARINDA — geçiş saatlerini gösterir
  const marks = [8,16,24].map(h => {
    const [x,y] = polar(C, C, R + 16, h);
    return `<text class="mk" x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}">${String(h%24).padStart(2,'0')}.00</text>`;
  }).join('');
  return `<svg class="clock" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
    ${marks}${segs}
    <circle cx="${C}" cy="${C}" r="${r-4}" fill="#fff"/>
    <text class="ctr-a" id="ctrA" x="${C}" y="${C+2}">Seçin</text>
    <text class="ctr-b" id="ctrB" x="${C}" y="${C+19}"></text>
  </svg>`;
}

function optList(q){

}

        `<button type="button" class="lk-b" data-v="${v}">${v}</button>`).join('')}</div>

}

    case 'vas': return `<div class="body"><div class="vas">${

      }</div><div class="ends"><span>${q.lo}</span><span>${q.hi}</span></div></div>`;
    case 'pct': return `<div class="body">
      <div class="pct-big" id="pctOut">—</div>

      <div class="ends"><span>Hiç düzelmez</span><span>Tamamen düzelir</span></div></div>`;
    case 'yn': return `<div class="body">${q.q.map(([k,t]) => `
      <div class="lk-row" data-yn="${k}">
        <div class="lk-q"><span>${t}</span></div>
        <div class="opts row" style="gap:8px">

    case 'ases': return `<div class="body">${likert('ases', ASES_OPTS, ASES_ADL, 0)}
      <div class="lk-done" id="done_ases"></div></div>`;
    case 'worc': return `<div class="body">${q.ww.q.map((t,n)=>`
      <div class="sl-row" data-w="${q.ww.k}" data-i="${n}">

      </div>`).join('')}<div class="lk-done" id="done_${q.ww.k}"></div></div>`;
    default: return `<div class="body">${optList(q)}</div>`;

}

const screens = [...document.querySelectorAll('.screen')];
const LAST = screens.length - 1;
let i = 0, sending = false, moving = false;

/* ═══ Gezinme ═══════════════════════════════════════════════════════════ */
function visible(n){ if (n<=0 || n>QS.length) return true; const q=QS[n-1]; return !q.when || q.when(); }
function step(d){ let n=i+d; while(n>0 && n<=QS.length && !visible(n)) n+=d; return Math.max(0,Math.min(LAST,n)); }
function go(n,dir){
  screens[i].classList.remove('live','in-f','in-b');
  i = n;
  screens[i].classList.add('live', dir>0?'in-f':'in-b');
  window.scrollTo(0,0); paint();
  setTimeout(()=>{moving=false;},380);
}
function autoNext(ms){ if(moving) return; moving=true;
  setTimeout(()=>{ moving=false; if(i<LAST) next(); }, ms); }
function next(){ if(moving) return; if(!ok()) return;
  if(i===QS.length){ submit(); return; } moving=true; go(step(1),1); }
function prev(){ if(moving) return; if(i>0){ moving=true; go(step(-1),-1); } }

function paint(){
  const done = i===0 ? 0 : Math.min(i,QS.length), kalan = QS.length-done;
  document.getElementById('rail').style.width = (done/QS.length*100)+'%';
  document.getElementById('count').innerHTML = (i>0 && i<=QS.length)
    ? (kalan===0 ? '<b>son bölüm</b>' : kalan<=4 ? `<b>${kalan}</b> bölüm kaldı` : `<b>${done}</b> / ${QS.length}`) : '';
  document.getElementById('back').classList.toggle('on', i>0 && i<=QS.length);
  document.getElementById('topbar').classList.toggle('solid', i>0);
  const dock = document.getElementById('dock'), cta = document.getElementById('cta');
  dock.classList.toggle('hide', i===LAST);
  cta.textContent = i===0 ? 'Başla' : i===QS.length ? 'Gönder' : 'Devam';
  cta.disabled = !answered(i);
  const qq = QS[i-1];
  if (qq && qq.type === 'pos') warmGrid();
}

/* ═══ Doğrulama — her bölüm zorunlu ═════════════════════════════════════ */
function val(id){ const e=document.getElementById(id); return e ? e.value.trim() : ''; }
function answered(n){
  if (n<=0 || n>QS.length) return true;
  const q = QS[n-1];
  switch(q.type){
    case 'protokol': return val('f_prot').trim().length >= 4;
    case 'ident':    return !!val('f_name');
    case 'num':      return !!val(q.id);
    case 'date':     return !!val('f_date');
    case 'hw':       return !!(val('f_h') && val('f_w'));
    case 'yn':       return q.q.every(([k]) => A[k]);
    case 'multi':    return !!(A[q.k]||[]).length;
    case 'pair':     return !!(val(q.a.id) && val(q.b.id));
    case 'pos':      return !!A.sleepPos;
    case 'clock':    return !!A.painHour;
    case 'vas':      return A[q.k] !== undefined;
    case 'pct':      return A.expPct !== undefined;
    case 'ases':     return (A.ases||[]).filter(x=>x!==undefined).length === 10;
    case 'worc':     return (A['worc_'+q.ww.k]||[]).filter(x=>x!==undefined).length === q.ww.q.length;
    default:         return !!A[q.k];
  }
}
function shake(el){ if(!el) return;
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},
              {transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:280,easing:'ease-out'}); }
function ok(){
  if (i===0 || i>QS.length) return true;
  const q = QS[i-1];
  if (!answered(i)){
    let t = screens[i].querySelector('.field, .lk-row:not(.ok), .body');
    if (q.type==='ases'){
      const eksik = [...screens[i].querySelectorAll('.lk-row')].find(r => !r.querySelector('.lk-b.on'));
      if (eksik){ t = eksik; eksik.scrollIntoView({behavior:'smooth',block:'center'}); }
    } else if (q.type==='worc'){
      const eksik = [...screens[i].querySelectorAll('.sl-row')].find(r => !r.classList.contains('ok'));
      if (eksik){ t = eksik; eksik.scrollIntoView({behavior:'smooth',block:'center'}); }
    } else if (q.type==='yn'){
      const eksik = [...screens[i].querySelectorAll('.lk-row')].find(r => !r.querySelector('.opt.on'));
      if (eksik){ t = eksik; eksik.scrollIntoView({behavior:'smooth',block:'center'}); }
    }
    shake(t); if(t && t.focus) t.focus();
    return false;
  }
  if (q.type==='protokol') A.protokol = val('f_prot').trim().toUpperCase();
  if (q.type==='ident')    A.name = val('f_name');
  if (q.type==='num')      A[q.k] = val(q.id);
  if (q.type==='date')     A[q.k] = val('f_date');
  if (q.type==='hw'){      A.height = val('f_h'); A.weight = val('f_w'); }
  if (q.type==='pair'){    A[q.a.k] = val(q.a.id); A[q.b.k] = val(q.b.id); }
  return true;
}

/* ═══ Etkileşim ═════════════════════════════════════════════════════════ */
stage.addEventListener('click', e => {
  const s = screens[i], q = QS[i-1];
  if (!q) return;

  // Evet / Hayır satırları
  const ynRow = e.target.closest('.lk-row[data-yn]');
  if (ynRow && s.contains(ynRow)){
    const b = e.target.closest('.opt'); if (!b) return;
    A[ynRow.dataset.yn] = b.dataset.v;
    [...ynRow.querySelectorAll('.opt')].forEach(x => x.classList.toggle('on', x===b));
    ynRow.classList.add('ok');
    document.getElementById('cta').disabled = !answered(i);
    if (answered(i)) autoNext(340);
    return;
  }

  // Likert (ASES günlük yaşam maddeleri)
  const lkRow = e.target.closest('.lk-row[data-g]');
  if (lkRow && s.contains(lkRow)){
    const b = e.target.closest('.lk-b'); if (!b) return;
    const g = lkRow.dataset.g, idx = +lkRow.dataset.i;
    (A[g] = A[g] || [])[idx] = +b.dataset.v;
    [...lkRow.querySelectorAll('.lk-b')].forEach(x => x.classList.toggle('on', x===b));
    lkRow.classList.add('ok');
    const hedef = ASES_ADL.length;
    const dolu = (A[g]||[]).filter(x=>x!==undefined).length;
    const out = document.getElementById('done_' + g);
    if (out) out.innerHTML = dolu===hedef ? '<b>Tamamlandı</b> — devam edebilirsiniz'
                                          : `${dolu} / ${hedef} yanıtlandı`;
    document.getElementById('cta').disabled = !answered(i);
    if (dolu === hedef) {
      const cta = document.getElementById('cta');
      cta.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    return;
  }

  // Uyku duruşu — fotoğrafa dokununca tam ekran, kartın altına dokununca seçer
  const posBtn = e.target.closest('.pos');
  if (posBtn && s.contains(posBtn)){
    const idx = [...posBtn.parentElement.children].indexOf(posBtn);
    if (e.target.closest('.pos-art')) { openLb(idx); return; }
    selectPos(posBtn.dataset.v);
    return;
  }

  // Ağrının en yoğun olduğu saat dilimi
  const seg = e.target.closest('.seg');
  if (seg && s.contains(seg)){
    A.painHour = seg.dataset.v;
    [...s.querySelectorAll('.seg')].forEach(x => x.classList.toggle('on', x===seg));
    const sl = SLOTS[+seg.dataset.k];
    const ca = document.getElementById('ctrA'), cb = document.getElementById('ctrB');
    ca.textContent = sl.word; ca.classList.add('set'); cb.textContent = sl.v;
    document.getElementById('cta').disabled = false;
    autoNext(420);
    return;
  }

  // 0-10 ağrı ölçeği
  const vb = e.target.closest('.vas-b');
  if (vb && s.contains(vb)){
    A[q.k] = +vb.dataset.v;
    [...vb.parentElement.children].forEach(x => x.classList.toggle('on', x===vb));
    document.getElementById('cta').disabled = false;
    autoNext(300);
    return;
  }

  // Çoklu seçim — "Hiçbiri" diğerlerini temizler
  if (q.type==='multi'){
    const mo = e.target.closest('.opt');
    if (!mo || !s.contains(mo)) return;
    const v = mo.dataset.v;
    let sec = A[q.k] || [];
    if (v === q.none) sec = sec.includes(v) ? [] : [v];
    else { sec = sec.filter(x => x !== q.none);
           sec = sec.includes(v) ? sec.filter(x => x !== v) : sec.concat([v]); }
    A[q.k] = sec;
    [...mo.parentElement.children].forEach(x => x.classList.toggle('on', sec.includes(x.dataset.v)));
    document.getElementById('cta').disabled = !answered(i);
    return;
  }

  // Tekli seçenek
  const opt = e.target.closest('.opt');
  if (opt && s.contains(opt)){
    A[q.k] = opt.dataset.v;
    [...opt.parentElement.children].forEach(x => x.classList.toggle('on', x===opt));
    document.getElementById('cta').disabled = false;
    autoNext(250);
    return;
  }
});

stage.addEventListener('input', e => {

    const ay = Math.round(gun/30.44*10)/10;
    out.innerHTML = `Travmadan bu yana <b>${gun} gün</b> (${ay} ay) geçmiş`;
    out.classList.add('on');

});

document.addEventListener('keydown', e => {
  if (e.key==='Enter'){ e.preventDefault(); next(); }
  else if (e.key==='Escape') prev();
});

const warmed = new Set();
function warm(list){
  list.forEach(u => { if (warmed.has(u)) return; warmed.add(u); const im = new Image(); im.src = u; });
}
function warmGrid(){ warm(POSITIONS.map(p => 'img/uyku/t' + p.img + '.jpg')); }
function warmFull(k){
  const n = POSITIONS.length;
  [0, 1, -1, 2, -2].forEach(d => warm(['img/uyku/p' + POSITIONS[(k + d + n) % n].img + '.jpg']));
}

/* ─── Pozisyon seçimi ve tam ekran ──────────────────────────────────────── */
let lbAt = 0;
const PHOTOS = () => POSITIONS;

function selectPos(id){
  A.sleepPos = id;
  const grid = screens[i].querySelector('.pos-grid');
  if (grid) [...grid.children].forEach(b => b.classList.toggle('on', b.dataset.v === id));
  document.getElementById('cta').disabled = false;

function paintLb(){
  const p = POSITIONS[lbAt];
  const list = PHOTOS(), n = list.indexOf(p) + 1;
  const el = document.getElementById('lbImg');
  const big = 'img/uyku/p' + p.img + '.jpg';
  // Önbellekteki küçük görseli hemen göster, büyüğü inince sessizce değiştir —
  // dokununca boş ekran beklemesin.
  el.src = warmed.has(big) ? big : 'img/uyku/t' + p.img + '.jpg';
  el.alt = p.name + ' — ' + p.sub;
  if (el.src.indexOf('/p') === -1) {
    const hi = new Image();
    hi.onload = () => { if (POSITIONS[lbAt] === p) el.src = big; warmed.add(big); };
    hi.src = big;
  }
  document.getElementById('lbName').textContent = p.name;
  document.getElementById('lbSub').textContent = p.sub;
  document.getElementById('lbCount').textContent = n + ' / ' + list.length;
  warmFull(lbAt);
}
function openLb(idx){
  lbAt = idx;
  paintLb();
  const lb = document.getElementById('lb');
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeLb(){
  document.getElementById('lb').hidden = true;
  document.body.style.overflow = '';
}
function stepLb(d){
  const list = PHOTOS();
  let k = list.indexOf(POSITIONS[lbAt]) + d;
  k = (k + list.length) % list.length;
  lbAt = POSITIONS.indexOf(list[k]);
  paintLb();
}
function confirmLb(){
  const id = POSITIONS[lbAt].id;
  closeLb();
  selectPos(id);
}

/* ═══ Puanlama ══════════════════════════════════════════════════════════ */
// ASES = (10 − ağrı) × 5 + (10 maddenin toplamı / 30) × 50 → 0-100, yüksek = iyi
function asesScore(){
  const adl = (A.ases||[]).filter(x=>x!==undefined);
  if (A.asesPain === undefined || adl.length !== 10) return '';
  const agri = (10 - A.asesPain) * 5;
  const fonk = adl.reduce((a,b)=>a+b,0) / 30 * 50;
  return Math.round((agri + fonk) * 10) / 10;
}
// WORC alanı = 100 − (madde ortalaması), tüm ölçek = 100 − (toplam / 21)
function worcVals(){ return WORC.map(w => (A['worc_'+w.k]||[]).filter(x=>x!==undefined)); }
function worcDom(k){
  const w = WORC.find(x=>x.k===k), v = (A['worc_'+k]||[]).filter(x=>x!==undefined);
  if (v.length !== w.q.length) return '';
  return Math.round((100 - v.reduce((a,b)=>a+b,0)/v.length) * 10) / 10;
}
function worcPct(){
  const v = worcVals();
  if (v.reduce((a,b)=>a+b.length,0) !== 21) return '';
  const toplam = v.reduce((a,b)=>a+b.reduce((x,y)=>x+y,0),0);
  return Math.round((100 - toplam/21) * 10) / 10;
}

/* ═══ Gönderim ══════════════════════════════════════════════════════════ */
function submit(){
  if (sending) return;
  sending = true;
  const cta = document.getElementById('cta');
  cta.textContent = 'Gönderiliyor…'; cta.disabled = true;

  const h=+A.height, w=+A.weight;
  const gun = A.traumaDate
    ? Math.floor((Date.now()-new Date(A.traumaDate+'T00:00:00'))/86400000) : '';

  const payload = {
    module:'rc', timestamp:new Date().toISOString(),
    name:A.name||'', patientId:A.protokol||qp.get('id')||'', src:qp.get('src')||'',
    age:A.age||'', gender:A.gender||'', height:h||'', weight:w||'',
    bmi:(h&&w)?Math.round(w/Math.pow(h/100,2)*10)/10:'',
    dominant:A.dominant||'', side:A.side||'',
    dominantSide:(A.dominant&&A.side)?(A.dominant===A.side?'Dominant':'Dominant değil'):'',
    smoke:A.smoke||'', comorbid:(A.comorbid||[]).join(', '),
    smokePerDay:A.smokePerDay||'', smokeYears:A.smokeYears||'',
    packYears:(A.smokePerDay&&A.smokeYears)
      ? Math.round(+A.smokePerDay/20*+A.smokeYears*10)/10 : '',
    smokeQuitYears:A.smokeQuit||'',
    durationMonths:A.durMon||'', onset:A.onset||'',
    traumaDate:A.traumaDate||'', daysSinceTrauma:gun,
    workComp:A.workComp||'', workLoad:A.workLoad||'',
    sportYes:A.sportYes||'', sport:A.sport||'', sportLevel:A.sportLvl||'',
    sportWeek:A.sportWeek||'', sportYears:A.sportYrs||'', overheadSport:A.ohSport||'',
    nightPain:A.nightPain||'', sideLie:A.sideLie||'', restPain:A.restPain||'',
    nightsPerWeek:A.nights||'',
    sleepPos:(posById(A.sleepPos)||{}).name||'',
    sleepPosNo:A.sleepPos ? POSITIONS.findIndex(p=>p.id===A.sleepPos)+1 : '',
    sleepPosBase:(posById(A.sleepPos)||{}).base||'',
    lieOnArm:A.lieOnArm||'', partner:A.partner||'', bedSide:A.bedSide||'',
    painHour:A.painHour||'',
    physio:A.physio||'', injections:A.inj||'', injectionTiming:A.injTime||'',
    prevSurgSame:A.prevSurgSame||'', prevOther:A.prevOther||'', neckProb:A.neckProb||'',
    asesPain:A.asesPain, ases:asesScore(),
    worcS:worcDom('ws'), worcSp:worcDom('wsp'), worcW:worcDom('ww'),
    worcL:worcDom('wl'), worcE:worcDom('we'), worc:worcPct(),
    expectGoal:A.expGoal||'', expectPct:A.expPct,
    asesRaw:(A.ases||[]).join(','),
    worcRaw:WORC.map(k=>(A['worc_'+k.k]||[]).join(',')).join(' | '),
  };

  if (PREVIEW){ setTimeout(()=>{ go(LAST,1); kopru(true); },500); return; }
  const f = document.createElement('iframe');
  f.style.display='none';
  f.src = APPS_SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify(payload));
  document.body.appendChild(f);
  setTimeout(()=>{ try{f.remove();}catch(e){} go(LAST,1); kopru(false); }, 2600);
}

/* ═══ İkinci bölüm — omuz seti ══════════════════════════════════════════
   Ameliyat sonrası kontroller form.html ile yapılıyor. Pre-op'ta da AYNI
   dosyayı kullanıyoruz: ölçekler kopyalanmadığı için iki dönem birebir
   karşılaştırılabilir kalıyor. İki kayıt protokol no ile eşleşir.          */
const OMUZ_URL = location.href.split(/[?#]/)[0].replace(/[^\/]*$/, '') + 'form.html';
// Önizlemede yönlendirme yapılmaz, yalnız düğme görünür
function kopru(onizleme){
  const not = document.getElementById('go2Note');
  if (onizleme){ not.textContent = 'Önizleme — ikinci bölüme geçmek için düğmeye dokunun.'; return; }
  let kalan = 5;
  const yaz = () => not.textContent = kalan + ' saniye içinde kendiliğinden açılacak.';
  yaz();
  const t = setInterval(() => { kalan--; if (kalan <= 0){ clearInterval(t); ikinciBolum(); } else yaz(); }, 1000);
}

function ikinciBolum(){
  const p = new URLSearchParams({
    name: A.name || '', id: A.protokol || qp.get('id') || '',
    leg: (A.side || '').toLocaleLowerCase('tr'), fu: 'preop',
    procedure: 'Rotator Manşet',
  });
  location.href = OMUZ_URL + '?' + p.toString();
}

/* ═══ Başlat ════════════════════════════════════════════════════════════ */
document.getElementById('today').textContent = new Date().toLocaleDateString('tr-TR');
if (qp.get('id')) { A.protokol = qp.get('id');
  setTimeout(()=>{ const p=document.getElementById('f_prot'); if(p) p.value=A.protokol; },0); }
if (qp.get('name')) { A.name = qp.get('name');
  setTimeout(()=>{ const n=document.getElementById('f_name'); if(n) n.value=A.name; },0); }
paint();
</script>
